# Workspace del proyecto en Rust (design/00-plan-provisional.md §3).
# El árbol en Red (src/, tests/) sigue intacto hasta alcanzar la paridad.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
# Versiones fijadas en design/00-plan-provisional.md §2.2.
eframe = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
